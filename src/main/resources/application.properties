spring.application.name=helpdesk-dashboard

# Base de datos H2 en memoria: se crea al arrancar y se borra al parar.
# Consola web para inspeccionarla: http://localhost:8080/h2-console (JDBC URL de abajo, usuario "sa", sin contraseña)
spring.datasource.url=jdbc:h2:mem:helpdesk;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
# Las consultas se hacen en los servicios, no al pintar la vista
spring.jpa.open-in-view=false

# Errores de la API en formato RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# Actuator: estado de la aplicación y datos de la build (versión, fecha)
management.endpoints.web.exposure.include=health,info

# Propiedades propias (HelpdeskProperties)
helpdesk.time-zone=Europe/Madrid
helpdesk.demo-data.enabled=true
helpdesk.demo-data.tickets=300
helpdesk.demo-data.days=90
helpdesk.demo-data.seed=42
