name: CI

# Se ejecuta en cada push (cualquier rama) y en cada pull request
on:
  push:
  pull_request:

permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux y Windows: la build tiene que funcionar igual en los dos
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar JDK 21 (Temurin) con caché de ~/.m2
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = tests unitarios (surefire) + tests de integración (failsafe) + umbral de cobertura (JaCoCo)
      - name: Compilar, testear y empaquetar
        shell: bash
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Guardar informes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Guardar informe de cobertura
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Guardar el JAR ejecutable
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: helpdesk-dashboard
          path: target/helpdesk-dashboard-*.jar
